name: Deploy CET-6 Web App

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-pages.yml
      - frontend/**
      - backend/data/cet6_vocabulary.json
      - backend/scripts/export_frontend_vocabulary.py
      - backend/scripts/export_frontend_daily_words.py
      - 每日英语单词/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Export daily knowledge base
        run: python backend/scripts/export_frontend_daily_words.py

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static offline app
        working-directory: frontend
        env:
          VITE_STATIC_MODE: "true"
          VITE_BASE_PATH: /liuji/
        run: npm run build

      - name: Prepare SPA fallback
        working-directory: frontend
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
